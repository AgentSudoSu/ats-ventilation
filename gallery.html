<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Gallery | ATS Ventilation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

header{
    width:100%;
    height:90px;

    background:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 35px;

    position:fixed;
    top:0;
    left:0;

    z-index:1000;

    box-shadow:0 2px 20px rgba(0,0,0,0.05);
}

.logo{
    font-size:22px;
    font-weight:600;
    letter-spacing:1px;
}

.logo span{
    font-weight:300;
    color:#666;
}

/* MENU BUTTON */

.menu-toggle{
    width:65px;
    height:65px;

    border-radius:50%;

    background:#fafafa;

    border:none;

    font-size:32px;

    cursor:pointer;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

/* MOBILE MENU */

.mobile-menu{
    position:fixed;

    top:90px;
    right:-100%;

    width:280px;
    height:100vh;

    background:white;

    padding:40px;

    transition:0.3s ease;

    z-index:999;
}

.mobile-menu.active{
    right:0;
}

.mobile-menu a{
    display:block;

    margin-bottom:30px;

    text-decoration:none;

    color:#111;

    font-size:28px;
    font-weight:600;
}

/* HERO */

.gallery-hero{
    padding-top:150px;
    padding-bottom:50px;

    text-align:center;
}

.gallery-hero h1{
    font-size:52px;
    line-height:1.1;

    margin-bottom:20px;
}

.gallery-hero p{
    max-width:700px;

    margin:auto;

    font-size:18px;

    color:#666;

    padding:0 20px;
}

/* GALLERY GRID */

.gallery-section{
    padding:0 8px 100px;
}

.gallery-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    max-width:1400px;

    margin:auto;
}

/* GALLERY ITEM */

.gallery-item{
    width:100%;

    aspect-ratio:1;

    overflow:hidden;

    background:#ddd;

    position:relative;
}

.gallery-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:0.3s ease;
}

.gallery-item:hover img{
    transform:scale(1.05);
}

/* FOOTER */

footer{
    background:#111;

    color:white;

    text-align:center;

    padding:60px 20px;
}

footer h3{
    margin-bottom:15px;

    font-size:28px;
}

footer p{
    color:#aaa;

    margin-bottom:10px;
}

/* MOBILE */

@media(max-width:768px){

    header{
        padding:0 20px;
    }

    .logo{
        font-size:18px;
    }

    .gallery-hero h1{
        font-size:42px;
    }

    .gallery-hero p{
        font-size:16px;
    }

    .gallery-grid{
        grid-template-columns:repeat(3,1fr);

        gap:6px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">
ATS <span>VENTILATION</span>
</div>

<button class="menu-toggle" id="menuToggle">
☰
</button>

</header>

<!-- MOBILE MENU -->

<div class="mobile-menu" id="mobileMenu">

<a href="index.html">Home</a>

<a href="index.html#services">Services</a>

<a href="gallery.html">Gallery</a>

<a href="contact.html">Contact</a>

</div>

<!-- HERO -->

<section class="gallery-hero">

<h1>Our Gallery</h1>

<p>
Take a look at some of our recent ventilation,
ducting and extraction projects.
</p>

</section>

<!-- GALLERY -->

<section class="gallery-section">

<div class="gallery-grid">

<div class="gallery-item">
<img src="images/Img.PNG" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery2.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery3.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery4.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery5.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery6.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery7.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery8.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery9.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery10.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery11.jpg" alt="">
</div>

<div class="gallery-item">
<img src="images/gallery12.jpg" alt="">
</div>

</div>

</section>

<!-- FOOTER -->

<footer>

<h3>ATS Ventilation</h3>

<p>Sheffield • South Yorkshire</p>

<p>07999 901 3788</p>

<p>info@atsventilation.co.uk</p>

</footer>

<script>

const menuToggle = document.getElementById('menuToggle');

const mobileMenu = document.getElementById('mobileMenu');

menuToggle.addEventListener('click', () => {

    mobileMenu.classList.toggle('active');

});

const menuLinks = document.querySelectorAll('.mobile-menu a');

menuLinks.forEach(link => {

    link.addEventListener('click', () => {

        mobileMenu.classList.remove('active');

    });

});

</script>

</body>
</html>
